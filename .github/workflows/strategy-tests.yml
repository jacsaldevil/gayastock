name: Strategy Unit Tests

on:
  pull_request:
  push:
    branches:
      - "agent/**"

jobs:
  strategy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run strategy tests
        run: python -m unittest discover -s tests -v
      - name: Compile strategy modules
        run: python -m py_compile strategy/*.py tests/test_strategy_rules.py config.py
