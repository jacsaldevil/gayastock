name: Strategy Unit Tests

on:
  pull_request:
  push:
    branches:
      - "agent/**"

jobs:
  strategy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run strategy tests
        run: python -m unittest discover -s tests -p "test_strategy_rules.py" -v
      - name: Compile changed runtime modules
        run: python -m py_compile strategy/*.py tests/*.py config.py main.py agent/trader.py data/trade_log.py
