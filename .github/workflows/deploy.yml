name: Deploy to Google Cloud Run

on:
  push:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-northeast3
  REGISTRY: asia-northeast3-docker.pkg.dev
  DASHBOARD_SERVICE: gayastock-dashboard
  AGENT_JOB: gayastock-agent

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Grant Vertex AI permission to runner SA
        run: |
          SA="gayastock-runner@$PROJECT_ID.iam.gserviceaccount.com"
          gcloud projects add-iam-policy-binding $PROJECT_ID \
            --member="serviceAccount:$SA" \
            --role="roles/aiplatform.user" --quiet 2>/dev/null || true

      - name: Grant Secret Manager accessor
        run: |
          SA="serviceAccount:gayastock-runner@$PROJECT_ID.iam.gserviceaccount.com"
          for SECRET in KIS_APP_KEY KIS_APP_SECRET KIS_ACCOUNT_NO; do
            gcloud secrets add-iam-policy-binding $SECRET \
              --member="$SA" --role="roles/secretmanager.secretAccessor" \
              --project=$PROJECT_ID --quiet 2>/dev/null || true
          done

      - name: Ensure GCS data bucket
        continue-on-error: true
        env:
          GCS_SECRET_BUCKET: ${{ secrets.GCS_DATA_BUCKET }}
        run: |
          # secrets.GCS_DATA_BUCKET 없으면 프로젝트 ID 기반 자동 사용
          BUCKET="${GCS_SECRET_BUCKET:-${PROJECT_ID}-gayastock}"
          # 버킷이 없으면 생성 (이미 있으면 무시)
          gsutil mb -l $REGION -p $PROJECT_ID gs://$BUCKET 2>/dev/null || true
          # runner SA에 버킷 objectAdmin 권한 부여
          gsutil iam ch \
            "serviceAccount:gayastock-runner@$PROJECT_ID.iam.gserviceaccount.com:roles/storage.objectAdmin" \
            gs://$BUCKET 2>/dev/null || true
          # logs/ 경로 공개 읽기 허용 (Claude 직접 접근용)
          gsutil iam ch allUsers:objectViewer gs://$BUCKET 2>/dev/null || true
          echo "GCS_DATA_BUCKET=$BUCKET" >> $GITHUB_ENV

      - name: Configure Docker
        run: gcloud auth configure-docker $REGISTRY --quiet

      - name: Build & Push Dashboard image
        run: |
          IMAGE="$REGISTRY/$PROJECT_ID/gayastock/app"
          docker build -t $IMAGE:$GITHUB_SHA -t $IMAGE:latest .
          docker push $IMAGE:$GITHUB_SHA
          docker push $IMAGE:latest

      - name: Build & Push Agent image
        run: |
          AGENT_IMAGE="$REGISTRY/$PROJECT_ID/gayastock/agent"
          docker build -f Dockerfile.agent -t $AGENT_IMAGE:$GITHUB_SHA -t $AGENT_IMAGE:latest .
          docker push $AGENT_IMAGE:$GITHUB_SHA
          docker push $AGENT_IMAGE:latest

      - name: Deploy Dashboard to Cloud Run
        run: |
          IMAGE="$REGISTRY/$PROJECT_ID/gayastock/app"
          ENV_FLAGS="GCP_PROJECT_ID=$PROJECT_ID,GCP_REGION=$REGION,KIS_MOCK=false,DRY_RUN=false,GCS_DATA_BUCKET=$GCS_DATA_BUCKET,INITIAL_CAPITAL=${{ secrets.INITIAL_CAPITAL }}"
          SECRETS_FLAGS="KIS_APP_KEY=KIS_APP_KEY:latest,KIS_APP_SECRET=KIS_APP_SECRET:latest,KIS_ACCOUNT_NO=KIS_ACCOUNT_NO:latest"
          gcloud run deploy $DASHBOARD_SERVICE \
            --image $IMAGE:$GITHUB_SHA --region $REGION \
            --platform managed --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2 \
            --service-account gayastock-runner@$PROJECT_ID.iam.gserviceaccount.com \
            --set-env-vars "$ENV_FLAGS" --set-secrets "$SECRETS_FLAGS" --quiet

      - name: Update Cloud Run Job (Agent)
        run: |
          IMAGE="$REGISTRY/$PROJECT_ID/gayastock/agent"
          ENV_FLAGS="GCP_PROJECT_ID=$PROJECT_ID,GCP_REGION=$REGION,KIS_MOCK=false,DRY_RUN=false,GCS_DATA_BUCKET=$GCS_DATA_BUCKET,LOG_DIR=/tmp/logs,INNER_LOOP_COUNT=5,INNER_LOOP_SLEEP_SEC=90"
          SECRETS_FLAGS="KIS_APP_KEY=KIS_APP_KEY:latest,KIS_APP_SECRET=KIS_APP_SECRET:latest,KIS_ACCOUNT_NO=KIS_ACCOUNT_NO:latest"
          COMMON_FLAGS="--image $IMAGE:$GITHUB_SHA --region $REGION --memory 512Mi --cpu 1 --task-timeout 1200 --service-account gayastock-runner@$PROJECT_ID.iam.gserviceaccount.com --set-env-vars $ENV_FLAGS --set-secrets $SECRETS_FLAGS"
          if gcloud run jobs describe $AGENT_JOB --region $REGION --quiet 2>/dev/null; then
            gcloud run jobs update $AGENT_JOB $COMMON_FLAGS
          else
            gcloud run jobs create $AGENT_JOB $COMMON_FLAGS
          fi

      - name: Remove old Cloud Scheduler jobs (10회 → 20회 전환)
        continue-on-error: true
        run: |
          for OLD in "${AGENT_JOB}-morning" "${AGENT_JOB}-midday" "${AGENT_JOB}-afternoon" \
                     "${AGENT_JOB}-run1" "${AGENT_JOB}-run2" "${AGENT_JOB}-run3" \
                     "${AGENT_JOB}-run4" "${AGENT_JOB}-run5"; do
            gcloud scheduler jobs delete "$OLD" --location $REGION --quiet 2>/dev/null || true
          done

      - name: Ensure Cloud Scheduler jobs (20회/일)
        continue-on-error: true
        run: |
          SA="gayastock-runner@$PROJECT_ID.iam.gserviceaccount.com"
          URI="https://${REGION}-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/${PROJECT_ID}/jobs/${AGENT_JOB}:run"
          FLAGS="--location $REGION --time-zone Asia/Seoul --uri $URI --http-method POST --oauth-service-account-email $SA --quiet"

          declare -A SCHEDULES=(
            ["${AGENT_JOB}-run01"]="20 9  * * 1-5"
            ["${AGENT_JOB}-run02"]="27 9  * * 1-5"
            ["${AGENT_JOB}-run03"]="34 9  * * 1-5"
            ["${AGENT_JOB}-run04"]="41 9  * * 1-5"
            ["${AGENT_JOB}-run05"]="48 9  * * 1-5"
            ["${AGENT_JOB}-run06"]="55 9  * * 1-5"
            ["${AGENT_JOB}-run07"]="2  10 * * 1-5"
            ["${AGENT_JOB}-run08"]="9  10 * * 1-5"
            ["${AGENT_JOB}-run09"]="16 10 * * 1-5"
            ["${AGENT_JOB}-run10"]="23 10 * * 1-5"
            ["${AGENT_JOB}-run11"]="30 10 * * 1-5"
            ["${AGENT_JOB}-run12"]="37 10 * * 1-5"
            ["${AGENT_JOB}-run13"]="44 10 * * 1-5"
            ["${AGENT_JOB}-run14"]="51 10 * * 1-5"
            ["${AGENT_JOB}-run15"]="58 10 * * 1-5"
            ["${AGENT_JOB}-run16"]="5  11 * * 1-5"
            ["${AGENT_JOB}-run17"]="12 11 * * 1-5"
            ["${AGENT_JOB}-run18"]="19 11 * * 1-5"
            ["${AGENT_JOB}-run19"]="26 11 * * 1-5"
            ["${AGENT_JOB}-run20"]="30 11 * * 1-5"
          )

          for JOB_NAME in "${!SCHEDULES[@]}"; do
            CRON="${SCHEDULES[$JOB_NAME]}"
            if gcloud scheduler jobs describe "$JOB_NAME" --location $REGION --quiet 2>/dev/null; then
              gcloud scheduler jobs update http "$JOB_NAME" $FLAGS --schedule "$CRON"
            else
              gcloud scheduler jobs create http "$JOB_NAME" $FLAGS --schedule "$CRON"
            fi
          done
