name: Deploy to Google Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-northeast3
  DASHBOARD_SERVICE: gayastock-dashboard
  AGENT_JOB: gayastock-agent
  SECRETS_FLAGS: "GOOGLE_API_KEY=GOOGLE_API_KEY:latest,KIS_APP_KEY=KIS_APP_KEY:latest,KIS_APP_SECRET=KIS_APP_SECRET:latest,KIS_ACCOUNT_NO=KIS_ACCOUNT_NO:latest"
  ENV_FLAGS: "KIS_MOCK=true,MAX_BUY_AMOUNT=500000,MAX_POSITIONS=5"

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build & Push Dashboard
        run: |
          docker build -t gcr.io/$PROJECT_ID/$DASHBOARD_SERVICE:$GITHUB_SHA -t gcr.io/$PROJECT_ID/$DASHBOARD_SERVICE:latest .
          docker push gcr.io/$PROJECT_ID/$DASHBOARD_SERVICE:$GITHUB_SHA
          docker push gcr.io/$PROJECT_ID/$DASHBOARD_SERVICE:latest

      - name: Deploy Dashboard to Cloud Run
        run: |
          gcloud run deploy $DASHBOARD_SERVICE \
            --image gcr.io/$PROJECT_ID/$DASHBOARD_SERVICE:$GITHUB_SHA \
            --platform managed \
            --region $REGION \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2 \
            --set-env-vars "$ENV_FLAGS" \
            --set-secrets "$SECRETS_FLAGS"

      - name: Build & Push Agent
        run: |
          docker build -f Dockerfile.agent -t gcr.io/$PROJECT_ID/$AGENT_JOB:$GITHUB_SHA -t gcr.io/$PROJECT_ID/$AGENT_JOB:latest .
          docker push gcr.io/$PROJECT_ID/$AGENT_JOB:$GITHUB_SHA
          docker push gcr.io/$PROJECT_ID/$AGENT_JOB:latest

      - name: Update Cloud Run Job (Agent)
        run: |
          gcloud run jobs update $AGENT_JOB \
            --image gcr.io/$PROJECT_ID/$AGENT_JOB:$GITHUB_SHA \
            --region $REGION \
            --memory 512Mi \
            --cpu 1 \
            --task-timeout 600 \
            --set-env-vars "$ENV_FLAGS" \
            --set-secrets "$SECRETS_FLAGS"

      - name: Deployment summary
        run: |
          URL=$(gcloud run services describe $DASHBOARD_SERVICE --region $REGION --format "value(status.url)")
          echo "✅ 배포 완료 — 대시보드: $URL"
