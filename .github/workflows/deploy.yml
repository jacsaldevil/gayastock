name: Deploy Dashboard to Cloud Run

on:
  push:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-northeast3
  REGISTRY: asia-northeast3-docker.pkg.dev
  DASHBOARD_SERVICE: gayastock-dashboard

jobs:
  deploy:
    name: Build & Deploy Dashboard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Delete Cloud Scheduler jobs (에이전트 트리거 제거)
        continue-on-error: true
        run: |
          for JOB in gayastock-agent-run01 gayastock-agent-run02 gayastock-agent-run03 \
                     gayastock-agent-run04 gayastock-agent-run05 gayastock-agent-run06 \
                     gayastock-agent-run07 gayastock-agent-run08 gayastock-agent-run09 \
                     gayastock-agent-run10 gayastock-agent-run11 gayastock-agent-run12 \
                     gayastock-agent-run13 gayastock-agent-run14; do
            gcloud scheduler jobs delete "$JOB" --location $REGION --quiet 2>/dev/null || true
          done

      - name: Delete Cloud Run Job (에이전트 잡 제거)
        continue-on-error: true
        run: |
          gcloud run jobs delete gayastock-agent --region $REGION --quiet 2>/dev/null || true

      - name: Ensure GCS data bucket (로그 읽기용)
        continue-on-error: true
        env:
          GCS_SECRET_BUCKET: ${{ secrets.GCS_DATA_BUCKET }}
        run: |
          BUCKET="${GCS_SECRET_BUCKET:-${PROJECT_ID}-gayastock}"
          gsutil mb -l $REGION -p $PROJECT_ID gs://$BUCKET 2>/dev/null || true
          gsutil iam ch \
            "serviceAccount:gayastock-runner@$PROJECT_ID.iam.gserviceaccount.com:roles/storage.objectAdmin" \
            gs://$BUCKET 2>/dev/null || true
          gsutil iam ch allUsers:objectViewer gs://$BUCKET 2>/dev/null || true
          echo "GCS_DATA_BUCKET=$BUCKET" >> $GITHUB_ENV

      - name: Configure Docker
        run: gcloud auth configure-docker $REGISTRY --quiet

      - name: Build & Push Dashboard image
        run: |
          IMAGE="$REGISTRY/$PROJECT_ID/gayastock/app"
          docker build -t $IMAGE:$GITHUB_SHA -t $IMAGE:latest .
          docker push $IMAGE:$GITHUB_SHA
          docker push $IMAGE:latest

      - name: Deploy Dashboard to Cloud Run
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
          INITIAL_CAPITAL: ${{ secrets.INITIAL_CAPITAL }}
        run: |
          IMAGE="$REGISTRY/$PROJECT_ID/gayastock/app"
          gcloud run deploy $DASHBOARD_SERVICE \
            --image $IMAGE:$GITHUB_SHA --region $REGION \
            --platform managed --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2 \
            --service-account gayastock-runner@$PROJECT_ID.iam.gserviceaccount.com \
            --set-env-vars "^||^GCP_PROJECT_ID=$PROJECT_ID||GCP_REGION=$REGION||KIS_MOCK=false||DRY_RUN=false||GCS_DATA_BUCKET=$GCS_DATA_BUCKET||INITIAL_CAPITAL=${INITIAL_CAPITAL}||KIS_APP_KEY=${KIS_APP_KEY}||KIS_APP_SECRET=${KIS_APP_SECRET}||KIS_ACCOUNT_NO=${KIS_ACCOUNT_NO}" \
            --clear-secrets \
            --quiet
