name: Deploy to Google Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-northeast3
  REGISTRY: asia-northeast3-docker.pkg.dev
  AR_REPO: gayastock
  DASHBOARD_SERVICE: gayastock-dashboard
  AGENT_JOB: gayastock-agent
  SECRETS_FLAGS: "KIS_APP_KEY=KIS_APP_KEY:latest,KIS_APP_SECRET=KIS_APP_SECRET:latest,KIS_ACCOUNT_NO=KIS_ACCOUNT_NO:latest"
  ENV_FLAGS: "KIS_MOCK=false,MAX_BUY_AMOUNT=500000,MAX_POSITIONS=5,GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},GCP_REGION=asia-northeast3,GCS_TOKEN_BUCKET=gayastock-token-cache-${{ secrets.GCP_PROJECT_ID }},GCS_DATA_BUCKET=gayastock-data-${{ secrets.GCP_PROJECT_ID }}"

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Grant Vertex AI permission to runner SA
        run: |
          SA="gayastock-runner@$PROJECT_ID.iam.gserviceaccount.com"
          gcloud projects add-iam-policy-binding $PROJECT_ID \
            --member="serviceAccount:$SA" \
            --role="roles/aiplatform.user" \
            --condition=None \
            --quiet 2>/dev/null || true

      - name: Ensure GCS buckets exist
        run: |
          SA="serviceAccount:gayastock-runner@$PROJECT_ID.iam.gserviceaccount.com"

          TOKEN_BUCKET="gayastock-token-cache-$PROJECT_ID"
          if ! gcloud storage buckets describe gs://$TOKEN_BUCKET --quiet 2>/dev/null; then
            gcloud storage buckets create gs://$TOKEN_BUCKET \
              --location=$REGION --uniform-bucket-level-access
            gcloud storage buckets add-iam-policy-binding gs://$TOKEN_BUCKET \
              --member="$SA" --role="roles/storage.objectAdmin"
          fi

          DATA_BUCKET="gayastock-data-$PROJECT_ID"
          if ! gcloud storage buckets describe gs://$DATA_BUCKET --quiet 2>/dev/null; then
            gcloud storage buckets create gs://$DATA_BUCKET \
              --location=$REGION --uniform-bucket-level-access
            gcloud storage buckets add-iam-policy-binding gs://$DATA_BUCKET \
              --member="$SA" --role="roles/storage.objectAdmin"
          fi

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker $REGISTRY --quiet

      - name: Build & Push Dashboard
        run: |
          IMAGE=$REGISTRY/$PROJECT_ID/$AR_REPO/$DASHBOARD_SERVICE
          docker build -t $IMAGE:$GITHUB_SHA -t $IMAGE:latest .
          docker push $IMAGE:$GITHUB_SHA
          docker push $IMAGE:latest

      - name: Deploy Dashboard to Cloud Run
        run: |
          IMAGE=$REGISTRY/$PROJECT_ID/$AR_REPO/$DASHBOARD_SERVICE
          gcloud run deploy $DASHBOARD_SERVICE \
            --image $IMAGE:$GITHUB_SHA \
            --platform managed \
            --region $REGION \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2 \
            --service-account gayastock-runner@$PROJECT_ID.iam.gserviceaccount.com \
            --set-env-vars "$ENV_FLAGS" \
            --set-secrets "$SECRETS_FLAGS"

      - name: Build & Push Agent
        run: |
          IMAGE=$REGISTRY/$PROJECT_ID/$AR_REPO/$AGENT_JOB
          docker build -f Dockerfile.agent -t $IMAGE:$GITHUB_SHA -t $IMAGE:latest .
          docker push $IMAGE:$GITHUB_SHA
          docker push $IMAGE:latest

      - name: Update Cloud Run Job (Agent)
        run: |
          IMAGE=$REGISTRY/$PROJECT_ID/$AR_REPO/$AGENT_JOB
          COMMON_FLAGS="--image $IMAGE:$GITHUB_SHA --region $REGION --memory 512Mi --cpu 1 --task-timeout 600 --service-account gayastock-runner@$PROJECT_ID.iam.gserviceaccount.com --set-env-vars $ENV_FLAGS --set-secrets $SECRETS_FLAGS"
          if gcloud run jobs describe $AGENT_JOB --region $REGION --quiet 2>/dev/null; then
            gcloud run jobs update $AGENT_JOB $COMMON_FLAGS
          else
            gcloud run jobs create $AGENT_JOB $COMMON_FLAGS
          fi

      - name: Remove old Cloud Scheduler jobs (10회 → 20회 전환)
        continue-on-error: true
        run: |
          for OLD in "${AGENT_JOB}-morning" "${AGENT_JOB}-midday" "${AGENT_JOB}-afternoon" \
                     "${AGENT_JOB}-run1" "${AGENT_JOB}-run2" "${AGENT_JOB}-run3" \
                     "${AGENT_JOB}-run4" "${AGENT_JOB}-run5"; do
            gcloud scheduler jobs delete "$OLD" --location $REGION --quiet 2>/dev/null || true
          done

      - name: Ensure Cloud Scheduler jobs (20회/일)
        continue-on-error: true
        run: |
          SA="gayastock-runner@$PROJECT_ID.iam.gserviceaccount.com"
          URI="https://${REGION}-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/${PROJECT_ID}/jobs/${AGENT_JOB}:run"
          FLAGS="--location $REGION --time-zone Asia/Seoul --uri $URI --http-method POST --oauth-service-account-email $SA --quiet"

          declare -A SCHEDULES=(
            ["${AGENT_JOB}-run01"]="20 9  * * 1-5"
            ["${AGENT_JOB}-run02"]="37 9  * * 1-5"
            ["${AGENT_JOB}-run03"]="54 9  * * 1-5"
            ["${AGENT_JOB}-run04"]="11 10 * * 1-5"
            ["${AGENT_JOB}-run05"]="28 10 * * 1-5"
            ["${AGENT_JOB}-run06"]="45 10 * * 1-5"
            ["${AGENT_JOB}-run07"]="2  11 * * 1-5"
            ["${AGENT_JOB}-run08"]="19 11 * * 1-5"
            ["${AGENT_JOB}-run09"]="36 11 * * 1-5"
            ["${AGENT_JOB}-run10"]="53 11 * * 1-5"
            ["${AGENT_JOB}-run11"]="10 12 * * 1-5"
            ["${AGENT_JOB}-run12"]="27 12 * * 1-5"
            ["${AGENT_JOB}-run13"]="44 12 * * 1-5"
            ["${AGENT_JOB}-run14"]="1  13 * * 1-5"
            ["${AGENT_JOB}-run15"]="18 13 * * 1-5"
            ["${AGENT_JOB}-run16"]="35 13 * * 1-5"
            ["${AGENT_JOB}-run17"]="52 13 * * 1-5"
            ["${AGENT_JOB}-run18"]="9  14 * * 1-5"
            ["${AGENT_JOB}-run19"]="26 14 * * 1-5"
            ["${AGENT_JOB}-run20"]="10 15 * * 1-5"
          )

          for JOB_NAME in "${!SCHEDULES[@]}"; do
            CRON="${SCHEDULES[$JOB_NAME]}"
            if gcloud scheduler jobs describe "$JOB_NAME" --location $REGION --quiet 2>/dev/null; then
              gcloud scheduler jobs update http "$JOB_NAME" $FLAGS --schedule "$CRON"
            else
              gcloud scheduler jobs create http "$JOB_NAME" $FLAGS --schedule "$CRON"
            fi
          done

      - name: Deployment summary
        run: |
          URL=$(gcloud run services describe $DASHBOARD_SERVICE --region $REGION --format "value(status.url)")
          echo "✅ 배포 완료 — 대시보드: $URL"
