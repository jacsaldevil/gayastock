name: Deploy to Google Cloud Run

on:
  push:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-northeast3
  DASHBOARD_SERVICE: gayastock-dashboard
  AGENT_JOB: gayastock-agent

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GCP 인증 (서비스 계정 키 방식)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      # ── 대시보드 ──────────────────────────────────────────
      - name: Build Dashboard image
        run: |
          docker build \
            -t gcr.io/$PROJECT_ID/$DASHBOARD_SERVICE:$GITHUB_SHA \
            -t gcr.io/$PROJECT_ID/$DASHBOARD_SERVICE:latest \
            .

      - name: Push Dashboard image
        run: |
          docker push gcr.io/$PROJECT_ID/$DASHBOARD_SERVICE:$GITHUB_SHA
          docker push gcr.io/$PROJECT_ID/$DASHBOARD_SERVICE:latest

      - name: Deploy Dashboard to Cloud Run
        run: |
          gcloud run deploy $DASHBOARD_SERVICE \
            --image gcr.io/$PROJECT_ID/$DASHBOARD_SERVICE:$GITHUB_SHA \
            --platform managed \
            --region $REGION \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2 \
            --set-env-vars "KIS_MOCK=true,MAX_BUY_AMOUNT=500000,MAX_POSITIONS=5" \
            --set-secrets \
              "GOOGLE_API_KEY=GOOGLE_API_KEY:latest,\
KIS_APP_KEY=KIS_APP_KEY:latest,\
KIS_APP_SECRET=KIS_APP_SECRET:latest,\
KIS_ACCOUNT_NO=KIS_ACCOUNT_NO:latest"

      # ── 에이전트 ──────────────────────────────────────────
      - name: Build Agent image
        run: |
          docker build \
            -f Dockerfile.agent \
            -t gcr.io/$PROJECT_ID/$AGENT_JOB:$GITHUB_SHA \
            -t gcr.io/$PROJECT_ID/$AGENT_JOB:latest \
            .

      - name: Push Agent image
        run: |
          docker push gcr.io/$PROJECT_ID/$AGENT_JOB:$GITHUB_SHA
          docker push gcr.io/$PROJECT_ID/$AGENT_JOB:latest

      - name: Update Cloud Run Job (Agent)
        run: |
          gcloud run jobs update $AGENT_JOB \
            --image gcr.io/$PROJECT_ID/$AGENT_JOB:$GITHUB_SHA \
            --region $REGION \
            --memory 512Mi \
            --cpu 1 \
            --task-timeout 600 \
            --set-env-vars "KIS_MOCK=true,MAX_BUY_AMOUNT=500000,MAX_POSITIONS=5" \
            --set-secrets \
              "GOOGLE_API_KEY=GOOGLE_API_KEY:latest,\
KIS_APP_KEY=KIS_APP_KEY:latest,\
KIS_APP_SECRET=KIS_APP_SECRET:latest,\
KIS_ACCOUNT_NO=KIS_ACCOUNT_NO:latest"

      - name: Deployment summary
        run: |
          DASHBOARD_URL=$(gcloud run services describe $DASHBOARD_SERVICE \
            --region $REGION --format "value(status.url)")
          echo "✅ 배포 완료"
          echo "🌐 대시보드: $DASHBOARD_URL"
